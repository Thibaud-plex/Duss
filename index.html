<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>3V Sécurité</title>
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3V Sécu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Carte en relief des 3 Vallées"></div>

<!-- Bandeau d'état : les 2 infos vitales, lisibles d'un coup d'œil -->
<header id="status">
  <button id="riskTile" class="tile" aria-label="Risque avalanche">
    <span class="big" id="riskNum">?</span>
    <span class="lbl"><b id="riskName">Avalanche</b><small id="riskSub">saisir le niveau</small></span>
  </button>
  <button id="wxTile" class="tile" aria-label="Météo">
    <span class="big" id="wxIcon">…</span>
    <span class="lbl"><b id="wxMain">Météo</b><small id="wxSub">chargement</small></span>
  </button>
</header>

<!-- Gros boutons de carte (utilisables avec des gants) -->
<div id="mapControls">
  <button id="btn3d" class="ctl on"><span class="i">⛰️</span><span id="lbl3d">3D</span></button>
  <button id="btnLayers" class="ctl"><span class="i">🗂️</span><span id="lblBase">Relief</span></button>
  <button id="btnSlopes" class="ctl"><span class="i">📐</span><span>Pentes</span></button>
  <button id="btnLocate" class="ctl"><span class="i">◎</span><span>Moi</span></button>
</div>
<div id="slopeLegend" class="legend hidden">
  <span><i style="background:#f2e600"></i>30°</span><span><i style="background:#ff8c00"></i>35°</span><span><i style="background:#e3001b"></i>40°</span><span><i style="background:#b0369f"></i>45°+</span>
</div>
<p id="hint" class="hint">Touchez la carte pour connaître la pente</p>

<!-- Fiche (piste, remontée, itinéraire, point touché, calques) -->
<section id="sheet" class="sheet hidden" aria-live="polite">
  <button class="close" id="sheetClose" aria-label="Fermer">✕</button>
  <div id="sheetBody"></div>
</section>

<!-- Panneaux plein écran -->
<section id="panel-meteo" class="panel hidden">
  <header><h2>🌨️ Météo — 5 heures</h2></header>
  <div class="panel-body" id="meteoBody"></div>
  <button class="back" data-close>← Retour à la carte</button>
</section>
<section id="panel-alertes" class="panel hidden">
  <header><h2>⚠️ Alertes et sécurité</h2></header>
  <div class="panel-body" id="alertesBody"></div>
  <button class="back" data-close>← Retour à la carte</button>
</section>
<section id="panel-forfaits" class="panel hidden">
  <header><h2>🎟️ Forfaits</h2></header>
  <div class="panel-body" id="forfaitsBody"></div>
  <button class="back" data-close>← Retour à la carte</button>
</section>
<section id="panel-position" class="panel hidden">
  <header><h2>📍 SOS et position</h2></header>
  <div class="panel-body" id="positionBody"></div>
  <button class="back" data-close>← Retour à la carte</button>
</section>

<nav id="tabbar">
  <button data-tab="meteo"><span class="ico">🌨️</span>Météo</button>
  <button data-tab="alertes"><span class="ico">⚠️</span>Alertes</button>
  <button data-tab="forfaits"><span class="ico">🎟️</span>Forfaits</button>
  <button data-tab="position" class="sos"><span class="ico">🆘</span>SOS</button>
</nav>

<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/maplibre-contour.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
